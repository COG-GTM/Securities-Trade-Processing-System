name: swarm
on:
  pull_request:
    branches: ["demo/swarm-live-before"]
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Harness self-test
        run: python3 -m unittest discover -s swarm -p 'test_*.py' -v
      - name: Swarm and regression tests (failures fail the job)
        run: mvn -B -s swarm/maven-settings.xml -Pswarm -Dswarm.testFailureIgnore=false test
