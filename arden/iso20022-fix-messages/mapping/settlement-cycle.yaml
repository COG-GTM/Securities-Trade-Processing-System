# Canonical settlement cycle mapping used when we generate outbound messages.
# FIX tag 63 (SettlType): 0=Regular, 1=Cash(T+0), 2=NextDay(T+1), 3=T+2, 4=T+3
# EU/UK/CH regular way moves to T+1 for trade dates on or after effective_from (SETTLE-4471);
# `before` applies to earlier trade dates. Pre-migration file: mapping/archive/settlement-cycle.pre-2027-10-11.yaml
# Default (unlisted markets) is unchanged.
default_cycle: T+2
default_fix_settl_type: "3"
markets:
  XNYS: { cycle: T+1, fix_settl_type: "2" }
  XNAS: { cycle: T+1, fix_settl_type: "2" }
  XTSE: { cycle: T+1, fix_settl_type: "2" }
  XLON: { cycle: T+1, fix_settl_type: "2", effective_from: 2027-10-11, before: { cycle: T+2, fix_settl_type: "3" } }
  XPAR: { cycle: T+1, fix_settl_type: "2", effective_from: 2027-10-11, before: { cycle: T+2, fix_settl_type: "3" } }
  XETR: { cycle: T+1, fix_settl_type: "2", effective_from: 2027-10-11, before: { cycle: T+2, fix_settl_type: "3" } }
  XSWX: { cycle: T+1, fix_settl_type: "2", effective_from: 2027-10-11, before: { cycle: T+2, fix_settl_type: "3" } }
