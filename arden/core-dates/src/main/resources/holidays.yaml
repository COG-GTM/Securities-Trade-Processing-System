# Market holiday calendars (settlement / CSD closures). Maintained by market-ops.
# Source of truth: CSD closure notices. Review annually in Q4. Weekends are implicit.
#
# NOTE for the T+1 programme: TARGET2 closures and national market closures diverge
# (e.g. Boxing Day is XLON-closed but TARGET2-open; Whit Monday is TARGET2-closed
# but XLON-open). Under T+2 these mismatches were absorbed by the extra day; under
# T+1 they surface directly as settlement-date disagreements between trading venue
# and cash leg. See docs/t1-calendar-mismatch.md.
